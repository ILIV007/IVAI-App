name: Android quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan tracked history and files
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-quality:
    name: Build, unit test, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"
      - name: Verify wrapper integrity
        run: unzip -t gradle/wrapper/gradle-wrapper.jar
      - name: Run provider-neutral branding guard
        run: bash scripts/check_provider_neutral_branding.sh
      - name: Run bounded RTL exception guard
        run: bash scripts/check_rtl_bounded_exceptions.sh
      - name: Run Phase 8.0 architecture-readiness guard
        run: bash scripts/check_phase80_architecture_readiness.sh
      - name: Run gated Provider/Model test readiness guard
        run: bash scripts/check_provider_model_test_readiness.sh
      - name: Run Phase 7.5 research-package verifier regression
        run: bash scripts/test_phase75_research_package_verifier.sh
      - name: Run Release Candidate package verifier regression
        run: bash scripts/test_release_candidate_package_verifier.sh
      - name: Run launcher icon safe-zone regression
        run: bash scripts/test_launcher_icon_assets.sh
      - name: Run semantic theme contrast regression
        run: python3 scripts/test_theme_contrast.py
      - name: Build debug and minified release APKs
        run: ./gradlew clean assembleDebug assembleRelease --no-daemon --stacktrace
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon --stacktrace
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            build/reports/**
          if-no-files-found: ignore
